# Supabase CLI configuration (local stack: `supabase start`, `supabase db reset`, `supabase test db`).
# Hosted projects take these values from the dashboard; keep both in sync.

project_id = "honest-os"

[api]
enabled = true
port = 54321
# PostgREST exposes only `api` to the app and `service` to the service-role
# dispatcher. Both schemas deny anon/authenticated by grants, not by this list.
schemas = ["api", "service"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/ar/auth/confirm",
  "http://localhost:3000/en/auth/confirm",
]
jwt_expiry = 3600
# Accounts are created by an admin (invite); nobody signs themselves up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
# Email sign-in code (src/app/[locale]/login/actions.ts verifyLoginCode): 8 digits valid for
# 10 minutes instead of the 6 digits / 1 hour default, so the code cannot be guessed within
# the verification rate limit below. Hosted projects: set the same values in the dashboard
# (docs/runbooks/supabase-vercel-setup.md §2).
otp_length = 8
otp_expiry = 600
# Minimum gap between two sign-in emails to one address (the hosted default). Each new email
# replaces the previous code, so this also limits how often anyone can void a user's code.
max_frequency = "60s"

[auth.rate_limit]
# OTP / magic-link verifications per 5 minutes per IP (the CLI default, pinned). The app's
# server actions call Supabase from the host's egress IPs, so all users share this budget:
# do not lower it without an app-side limit.
token_verifications = 30
