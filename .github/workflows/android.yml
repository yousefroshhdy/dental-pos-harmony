# Honest OS Android shell (D-14 phase 2, mobile/README.md): builds the APKs of the Capacitor
# remote-URL app. No signing secrets:
# - honest-os-android-pilot: the PILOT APK (release type, not debuggable), signed with the
#   SDK's debug key (android/app/build.gradle). What IT installs for the pilot.
# - honest-os-android-debug: the debug APK, for development only (debuggable).
# Production signing (a keystore in GitHub secrets) is documented in mobile/README.md and
# not built yet.
#
# Every action is pinned to a full commit SHA (audit 4 F8); the tag it was resolved from is
# in the trailing comment (git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>,
# the peeled ^{} commit for annotated tags). To update one, resolve the new tag the same way.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [ccr-cd8ec6c2-y28xig]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: mobile

jobs:
  apks:
    name: Pilot and debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The deployment the WebView opens: repository variable CAP_SERVER_URL (Settings ›
      # Secrets and variables › Actions › Variables), else staging. https only.
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || 'https://honest-os-staging.vercel.app' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      # The action's default package list includes the legacy "tools" package, which
      # current sdkmanager releases no longer ship (run 1 failed on it). The Android
      # Gradle plugin downloads the platform and build-tools it needs itself.
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # No dependency needs an install script (package-lock.json has no hasInstallScript), so
      # none runs. The capacitor:copy:before hook is a package.json script that `cap sync`
      # runs itself; it is not affected.
      - name: Install (mobile/package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capacitor sync
        run: |
          echo "WebView URL: $CAP_SERVER_URL"
          npx cap sync android

      # Validates the committed gradle-wrapper.jar against Gradle's published checksums
      # and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # assembleDebug first: it creates the SDK debug keystore that also signs the pilot APK.
      - name: Unit tests, debug APK, pilot APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          ./gradlew --no-daemon assembleRelease

      - name: Check the pilot APK (not debuggable, signed, no backup)
        working-directory: mobile/android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          badging=$("$tools/aapt2" dump badging "$apk")
          if grep -q 'application-debuggable' <<<"$badging"; then
            echo "::error::the pilot APK is debuggable"
            exit 1
          fi
          manifest=$(find app/build/intermediates -path '*merged_manifest*' -path '*release*' -name AndroidManifest.xml | head -n 1)
          echo "Merged manifest: $manifest"
          grep -E 'uses-permission|foregroundServiceType|<service|allowBackup|dataExtractionRules|fullBackupContent' "$manifest" || true
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"

      - name: Upload the pilot APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: honest-os-android-pilot
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: honest-os-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
